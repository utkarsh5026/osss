name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: unit (${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
        os: [ubuntu-latest]
        include:
          # setup-python publishes no Python 3.9 build for ubuntu-latest (26.04);
          # 24.04 still has one, and 3.9 is the oldest version we support.
          - python: "3.9"
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.osss/downloads
          key: opensearch-tarballs-3.9.0
      - run: pip install -e ".[dev]"
      - name: Integration tests (tarball backend, real OpenSearch)
        run: OSSS_TEST_LOCAL=1 pytest -q -m integration
        env:
          OSSS_TEST_LOCAL: "1"
      - name: CLI smoke test
        run: |
          osss status
          osss index README.md --name readme
          osss search readme "notebook"
          osss stop
