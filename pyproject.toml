[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "osss"
dynamic = ["version"]
description = "Local OpenSearch in one line: index S3 buckets or local folders and search them from any notebook (SageMaker, Jupyter, VS Code, Colab)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "utkarsh5026" }]
keywords = ["opensearch", "search", "notebook", "sagemaker", "jupyter", "s3", "semantic-search", "rag"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Jupyter",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Database :: Database Engines/Servers",
  "Topic :: Text Processing :: Indexing",
]
dependencies = [
  "opensearch-py>=2.4",
  "boto3>=1.26",
  "ipywidgets>=7.6",
  "rich>=12",
  "tqdm>=4.64",
  "pypdf>=3.9",
]

[project.optional-dependencies]
docx = ["python-docx>=0.8"]
parquet = ["pandas>=1.3", "pyarrow>=8"]
semantic = ["sentence-transformers>=2.2"]
all = ["python-docx>=0.8", "pandas>=1.3", "pyarrow>=8", "sentence-transformers>=2.2"]
dev = ["pytest>=7", "moto[s3]>=5", "python-docx>=0.8", "pandas>=1.3", "pyarrow>=8"]

[project.scripts]
osss = "osss.cli:main"

[project.urls]
Homepage = "https://github.com/utkarsh5026/osss"
Issues = "https://github.com/utkarsh5026/osss/issues"

[tool.hatch.version]
path = "src/osss/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/osss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running OpenSearch (set OSSS_TEST_URL or OSSS_TEST_LOCAL=1)"]
